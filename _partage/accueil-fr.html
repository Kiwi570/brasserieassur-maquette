<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4efe6;color:#14213d}
.carte{position:relative;display:grid;grid-template-columns:600px 600px;width:1200px;height:630px;padding:0;overflow:visible;isolation:auto;background-color:#f4efe6;
  background-image:linear-gradient(rgba(20,33,61,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,33,61,.06) 1px,transparent 1px);background-size:30px 30px}
.carte-texte{display:flex;flex-direction:column;justify-content:space-between;padding:56px 40px 52px 60px}
.carte-tete{display:flex;align-items:center;gap:16px}
.carte-tete img{width:76px;height:76px}
.carte-tete .marque{font-size:30px}
.carte-repere{font:500 15px/1.3 var(--police-mono);letter-spacing:.14em;text-transform:uppercase;color:#b23a2e;margin:0 0 14px}
.carte-titre{font-family:var(--police-titres);font-variation-settings:'opsz' 96;font-weight:560;font-size:66px;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.015em}
.carte-pied{font:500 16px/1.4 var(--police-mono);letter-spacing:.06em;margin:0;display:flex;gap:14px;align-items:center}
.carte-pied::before{content:'';width:56px;height:1.5px;background:#14213d}
.carte-image{margin:40px 40px 40px 0;border:1.5px solid #14213d;background:#14213d center/cover no-repeat;position:relative}
.carte::before{content:none}
.carte-image::after{content:'';position:absolute;inset:10px;border:1px solid rgba(244,239,230,.55)}</style>
</head><body>
<div class="carte">
  <div class="carte-texte">
    <div class="carte-tete"><img src="/assets/images/logo.svg" alt=""><span class="marque"><span class="marque-b">BRASSERIE</span><span class="marque-a">assur</span></span></div>
    <div><p class="carte-repere">Courtier en assurance · filière bière</p><p class="carte-titre">L’assurance des métiers de la bière</p></div>
    <p class="carte-pied">ORIAS n° 24008249</p>
  </div>
  <div class="carte-image" style="background-image:url('/assets/images/grok/accueil-ouverture-1168.webp')"></div>
</div>
</body></html>
